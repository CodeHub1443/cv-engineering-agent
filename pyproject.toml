[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cv-agent"
version = "0.1.0"
description = "CV Engineering Agent — autonomous Computer Vision engineering assistant"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "langgraph>=1.2,<2.0",
    "typing_extensions>=4.12,<7",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[project.scripts]
cv-agent = "cv_agent.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["cv_agent"]


[tool.hatch.build.targets.wheel.force-include]
"config/default.toml" = "cv_agent/resources/default.toml"
"spec/capability_registry.json" = "cv_agent/resources/capability_registry.json"
